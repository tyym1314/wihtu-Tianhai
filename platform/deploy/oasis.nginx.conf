limit_req_zone $binary_remote_addr zone=oasis_login:1m rate=6r/m;
map $uri $oasis_static_cache_control {
    default "public, max-age=0, must-revalidate";
    "~-[A-Za-z0-9_-]{8}\.(js|mjs|css|png|webp|jpe?g|svg|glb|gltf|bin|woff2?|mp3|ogg|wasm)$" "public, max-age=31536000, immutable";
    "~-mobile-[a-f0-9]{10}\.webp$" "public, max-age=31536000, immutable";
}
server {
    listen 443 ssl http2;
    server_name game.tianyahuyu.com;
    ssl_certificate /opt/oasis/acme/config/live/oasis-game/fullchain.pem;
    ssl_certificate_key /opt/oasis/acme/config/live/oasis-game/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OASIS_TLS:2m;
    # Shared HTTPS ingress, isolated by an exact new hostname. The application
    # itself owns the previously unused loopback port 18880.
    location / {
        proxy_pass http://127.0.0.1:18880;
        # The inner ingress requires HTTP/1.1 for gzip. A 1.0 proxy hop
        # silently sends JavaScript and room snapshots without compression.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl http2;
    server_name oasis.43.98.202.236.sslip.io;
    ssl_certificate /opt/oasis/acme/config/live/oasis-sandbox/fullchain.pem;
    ssl_certificate_key /opt/oasis/acme/config/live/oasis-sandbox/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://game.tianyahuyu.com$request_uri;
}
server {
    listen 127.0.0.1:18880;
    server_name game.tianyahuyu.com;
    root /opt/oasis/current/platform/dist;
    client_max_body_size 128k;
    server_tokens off;
    access_log /var/log/nginx/oasis-access.log;
    error_log /var/log/nginx/oasis-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml model/gltf-binary;
    location = /demo { return 302 /demo/; }
    location ^~ /demo/ { proxy_pass http://127.0.0.1:18885; }
    location ^~ /api/demo/ { proxy_pass http://127.0.0.1:18885; }
    location ~ ^/api/(admin|partner)/login$ {
        limit_req zone=oasis_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18881;
    }
    location = /health { proxy_pass http://127.0.0.1:18881; }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }
    location = /downloads/android-smoke-build.json {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(pem|key|env|sql)$ { deny all; }
    # Android downloads need their package MIME, and a missing APK must not
    # fall through to the console SPA. Keep native HEAD/validators/ranges.
    location ~* ^/downloads/.*\.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
    }
    # Content-addressed bootstrap bundles remain available across current switches.
    # The directory contains only reviewed public static resources, never releases.
    location ~ "^/release-artifacts/([a-f0-9]{64}\.tar\.gz)$" {
        alias /opt/oasis/release-artifacts/$1;
        types { application/gzip gz; }
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location /release-artifacts/ { return 404; }
    # Reviewed assets survive current/rollback switches. The publisher refuses
    # a different hash at an existing URL; mutable non-retained files fall back
    # to the current release. Security regexes above take precedence.
    location ~ ^/(arena/assets|legacy/assets|legacy/bundles)/ {
        root /opt/oasis/static-assets;
        types {
            application/javascript js mjs; text/css css;
            image/png png; image/webp webp; image/jpeg jpg jpeg; image/svg+xml svg;
            model/gltf-binary glb; model/gltf+json gltf; application/wasm wasm;
            application/octet-stream bin; font/woff woff; font/woff2 woff2;
            audio/mpeg mp3; audio/ogg ogg; video/webm webm;
        }
        try_files $uri @oasis_api_static;
        add_header Cache-Control $oasis_static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/(assets|previews)/ {
        root /opt/oasis/static-assets;
        types {
            application/javascript js mjs; text/css css;
            image/png png; image/webp webp; image/jpeg jpg jpeg; image/svg+xml svg;
            model/gltf-binary glb; model/gltf+json gltf; application/wasm wasm;
            application/octet-stream bin; font/woff woff; font/woff2 woff2;
            audio/mpeg mp3; audio/ogg ogg; video/webm webm;
        }
        try_files $uri @oasis_admin_static;
        add_header Cache-Control $oasis_static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /mark.svg {
        root /opt/oasis/static-assets;
        try_files $uri @oasis_admin_static;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location @oasis_api_static { proxy_pass http://127.0.0.1:18881; }
    location @oasis_admin_static {
        try_files $uri =404;
        add_header Cache-Control $oasis_static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/(api|v1|play|arena|legacy)/ { proxy_pass http://127.0.0.1:18881; }
    location / { try_files $uri $uri/ /index.html; }
}
