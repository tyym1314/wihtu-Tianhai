limit_req_zone $binary_remote_addr zone=oasis_login:1m rate=6r/m;
server {
    listen 443 ssl http2;
    server_name game.tianyahuyu.com;
    ssl_certificate /opt/oasis/acme/config/live/oasis-game/fullchain.pem;
    ssl_certificate_key /opt/oasis/acme/config/live/oasis-game/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OASIS_TLS:2m;
    # Shared HTTPS ingress, isolated by an exact new hostname. The application
    # itself owns the previously unused loopback port 18880.
    location / {
        proxy_pass http://127.0.0.1:18880;
        # The inner ingress requires HTTP/1.1 for gzip. A 1.0 proxy hop
        # silently sends JavaScript and room snapshots without compression.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl http2;
    server_name oasis.43.98.202.236.sslip.io;
    ssl_certificate /opt/oasis/acme/config/live/oasis-sandbox/fullchain.pem;
    ssl_certificate_key /opt/oasis/acme/config/live/oasis-sandbox/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://game.tianyahuyu.com$request_uri;
}
server {
    listen 127.0.0.1:18880;
    server_name game.tianyahuyu.com;
    root /opt/oasis/current/platform/dist;
    client_max_body_size 128k;
    server_tokens off;
    access_log /var/log/nginx/oasis-access.log;
    error_log /var/log/nginx/oasis-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml model/gltf-binary;
    location = /demo { return 302 /demo/; }
    location ^~ /demo/ { proxy_pass http://127.0.0.1:18885; }
    location ^~ /api/demo/ { proxy_pass http://127.0.0.1:18885; }
    location ~ ^/api/(admin|partner)/login$ {
        limit_req zone=oasis_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18881;
    }
    location ~ ^/(api|v1|play|arena|legacy)/ { proxy_pass http://127.0.0.1:18881; }
    location = /health { proxy_pass http://127.0.0.1:18881; }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }
    location = /downloads/android-smoke-build.json {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(pem|key|env|sql)$ { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
