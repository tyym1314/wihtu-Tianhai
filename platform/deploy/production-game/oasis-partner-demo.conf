server {
 listen 443 ssl http2;
 server_name partner-demo.43.98.202.236.sslip.io;
 ssl_certificate /opt/oasis/acme/config/live/oasis-partner-demo/fullchain.pem;
 ssl_certificate_key /opt/oasis/acme/config/live/oasis-partner-demo/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 64k;
 location / {
  proxy_pass http://127.0.0.1:18901;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_read_timeout 10s;
 }
}
