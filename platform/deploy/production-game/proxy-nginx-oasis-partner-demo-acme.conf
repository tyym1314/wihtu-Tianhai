# Additive named vhost for the OASIS demo partner ACME challenge only.
server {
    listen 80;
    server_name partner-demo.43.98.202.236.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://172.17.0.1:18884;
        proxy_set_header Host $host;
    }
    location / { return 301 https://partner-demo.43.98.202.236.sslip.io$request_uri; }
}
