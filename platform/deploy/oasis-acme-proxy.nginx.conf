# Additive named vhost. Existing default/domain routes stay unchanged.
server {
    listen 80;
    server_name game.tianyahuyu.com oasis.43.98.202.236.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://172.17.0.1:18884;
        proxy_set_header Host $host;
    }
    location / { return 301 https://game.tianyahuyu.com$request_uri; }
}
