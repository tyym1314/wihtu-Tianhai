<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>OASIS</title>
<style>
html,body{margin:0;height:100%;background:#120b24;color:#f6ecd2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#3a2160,#120b24 70%);transition:opacity .25s}
#status[hidden]{display:none}
#status h1{font-size:18px;margin:0;font-weight:600}
#status p{font-size:14px;margin:0;opacity:.75;max-width:280px;line-height:1.5}
#status button{margin-top:6px;border:1px solid #d9b46a;background:transparent;color:#f3d48f;border-radius:999px;padding:10px 26px;font-size:15px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(243,212,143,.25);border-top-color:#f3d48f;animation:r .8s linear infinite}
#status[data-state=error] .spin{display:none}
@keyframes r{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<main id="game" aria-label="游戏"></main>
<section id="status" data-state="loading" role="status" aria-live="polite">
 <div class="spin" aria-hidden="true"></div>
 <h1 id="title">正在进入游戏</h1>
 <p id="message">请稍候…</p>
 <button id="back" type="button" hidden>返回</button>
</section>
<script type="module">
import {OasisHost} from '/sdk/oasis-h5.mjs';
const GAMES=['match','golf','carrom','darts','ludo','jackaroo','domino','pool','bowling','run','towerlink','thunder','tiger','greedylion','rocketstar2','teenpatti','olympus','greedycat2','greedyking','greedybrutal','bigeater','fruitparty','greedyforest','herochest','crazyfruit','footballleague','glorycup','bountyfootball','magiccard','solomonmines','roulette','roulettepro','sicbo','crash','crashstar','monster','molestar','oceanslot','mahjongslot','cleopatraslot','crazygems','slot777','djlive','jackpotslots'];
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));
const gameId=params.get('game'),code=fragment.get('code'),sessionId=fragment.get('session');
// Language: ?lang=zh|en|ar from the App, else the device language. Stored for the same-origin game page.
const pickLang=v=>{v=String(v||'').toLowerCase();return v.startsWith('zh')?'zh':v.startsWith('ar')?'ar':v.startsWith('en')?'en':null;};
const lang=pickLang(params.get('lang')||params.get('locale'))||(()=>{try{return pickLang(localStorage.getItem('oasis-locale'));}catch{return null;}})()||pickLang(navigator.language)||'zh';
try{localStorage.setItem('oasis-locale',lang);}catch{}
document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const T={zh:{entering:'正在进入游戏',wait:'请稍候…',back:'返回',badTitle:'无法进入游戏',badMsg:'启动参数无效，请返回 App 重新进入。',errTitle:'游戏暂时无法连接',expired:'会话已过期，请返回 App 重新进入。',retry:'请返回 App 后重新进入。'},
 en:{entering:'Entering the game',wait:'Please wait…',back:'Back',badTitle:"Can't open the game",badMsg:'Invalid launch link. Go back to the app and try again.',errTitle:"Can't connect to the game",expired:'Session expired. Go back to the app and reopen the game.',retry:'Go back to the app and try again.'},
 ar:{entering:'جارٍ الدخول إلى اللعبة',wait:'يرجى الانتظار…',back:'رجوع',badTitle:'تعذّر فتح اللعبة',badMsg:'رابط التشغيل غير صالح. ارجع إلى التطبيق وحاول مجدداً.',errTitle:'تعذّر الاتصال باللعبة',expired:'انتهت الجلسة. ارجع إلى التطبيق وافتح اللعبة مجدداً.',retry:'ارجع إلى التطبيق وحاول مجدداً.'}}[lang];
$('title').textContent=T.entering;$('message').textContent=T.wait;$('back').textContent=T.back;
// The one-time code never stays in the address bar, history or a later referrer.
history.replaceState(null,'',location.pathname+location.search);
let sdk=null,closed=false,launchUsed=false;
function show(state,title,message){const s=$('status');s.hidden=false;s.dataset.state=state;$('title').textContent=title;$('message').textContent=message;$('back').hidden=state!=='error';}
function notifyApp(type,detail={}){
 const payload=JSON.stringify({type,game_id:gameId,...detail});
 try{if(window.OasisApp&&typeof window.OasisApp.postMessage==='function'){window.OasisApp.postMessage(payload);return true;}}catch{}
 try{if(window.webkit?.messageHandlers?.oasis){window.webkit.messageHandlers.oasis.postMessage(payload);return true;}}catch{}
 try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(payload);return true;}}catch{}
 if(window.parent!==window){window.parent.postMessage({type:'oasis.'+type,game_id:gameId,...detail},'*');return true;}
 return false;
}
function close(detail={}){if(closed)return;closed=true;sdk?.destroy();if(!notifyApp('close',detail)&&history.length>1)history.back();}
function requestBack(){if(closed)return true;if(sdk?.loaded&&!sdk.closed){$('status').hidden=true;sdk.requestBack();}else close({reason:'user'});return true;}
Object.defineProperty(window,'OasisLauncher',{value:Object.freeze({requestBack,setHostState:state=>sdk?.setHostState(state)}),configurable:false});
$('back').addEventListener('click',()=>close({reason:'error'}));
if(!GAMES.includes(gameId)||!code||code.length<8||!sessionId){show('error',T.badTitle,T.badMsg);}
else{
 sdk=new OasisHost({platformOrigin:location.origin,gameId,timeoutMs:45000,
  requestLaunch:async({resumeSessionId})=>{
   if(!launchUsed&&!resumeSessionId){launchUsed=true;return{entry_url:location.origin+'/play/'+gameId,launch_code:code,session_id:sessionId};}
   // A fresh launch code must come from the App backend; ask the App to reopen this session.
   notifyApp('reauth_required',{session_id:resumeSessionId||sessionId});
   throw Object.assign(new Error(T.expired),{code:'REAUTH_REQUIRED'});
  },
  onEvent:event=>{
   if(event.type==='loaded'){$('status').hidden=true;notifyApp('loaded',{session_id:event.session_id});}
   else if(event.type==='return_requested')close({reason:event.reason,room_id:event.room_id,status:event.status});
   else if(event.type==='error'){show('error',T.errTitle,event.code==='REAUTH_REQUIRED'||event.code==='REAUTH_FAILED'?T.expired:T.retry);notifyApp('error',{code:event.code});}
  }});
 sdk.mount($('game')).catch(()=>{});
 // The game page has its own branded loader; reveal it as soon as it paints.
 sdk.frame?.addEventListener('load',()=>{if($('status').dataset.state==='loading')$('status').hidden=true;},{once:true});
}
document.addEventListener('visibilitychange',()=>sdk?.setHostState({visible:!document.hidden}));
</script>
</body>
</html>
